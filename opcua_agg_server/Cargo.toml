[package]
name = "roboteach_aggserver"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Runtime aggregation server for heterogeneous OPC UA information models"
license = "PolyForm-Noncommercial-1.0.0"
readme = "../README.md"
publish = false

[dependencies]
ctrlc = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openssl = { version = "0.10", features = ["vendored"] }
opcua = { path = "vendor/opcua" }
lazy_static = "1.5.0"
chrono = { version = "0.4.39", features = ["clock"] }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
roxmltree = "0.19"
anyhow = "1.0.102"
pyo3 = { version = "0.28.2", features = ["auto-initialize"] }
axum = "0.8.8"
http = "1.4.0"
zip = "8.1.0"
tokio = "1.49.0"

# The vendored OPC UA 0.12 fork corrupts allocator state when optimized at
# level 3 with Rust 1.96 / LLVM 22 on x86_64-pc-windows-msvc. Keep the
# application optimized while compiling only the legacy protocol fork with a
# conservative profile for interoperability validation.
[profile.release.package.opcua]
opt-level = 1
